# Weekly dependency + action update PRs (Milestone C / item 16). The first run showed that
# grouping *minors* hides which bump broke CI, and that framework-coupled majors
# (react / next / typescript / tailwind / types / eslint / blocknote / excalidraw / playwright)
# must be deliberate, tested upgrades — not auto-PRs. So: patch bumps grouped, minors individual,
# framework majors ignored.
#
# Step 88 addendum: react/react-dom 19.2.3->19.2.8 + @tiptap/pm 3.30.0->3.30.5 (which Dependabot
# classifies as *patch*, so the major-ignore below didn't stop them) reproduced a ProseMirror
# `localsInner` TypeError across the editor/canvas specs on BOTH chromium and webkit (PR #58, and
# PR #51 before it) — so react*/@tiptap/* were held at every update type pending a bisect.
#
# Step 96: bisected and fixed. Root cause was a "dual package hazard", not React or @tiptap
# themselves — apps/web had a redundant, unused direct `@tiptap/pm` dependency (nothing imported
# it) that gave pnpm's peer-aware resolver a second, competing place to resolve `@tiptap/pm`'s
# bundled `prosemirror-view`, so two physically different copies of prosemirror-view ended up
# loaded at once; a Decoration built by one copy's class handed to the other copy's
# DecorationGroup is exactly what throws `localsInner is not a function`. Fix: dropped the dead
# dependency, and root `package.json`'s `pnpm.overrides` now pins `@tiptap/pm` +
# `prosemirror-view` to one version each so pnpm can't resolve two copies again regardless of the
# peer graph. Verified: single `prosemirror-view` resolution in the lockfile, full e2e suite
# (chromium/webkit/mobile-safari) green. react*/@tiptap/* are unheld — only the pre-existing
# semver-major ignore below still applies, same as every other framework package.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      patch:
        update-types: [patch]
    ignore:
      # Framework / toolchain — upgrade by hand with a full test pass, never via Dependabot.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-is"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next-themes"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@blocknote/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@excalidraw/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tanstack/react-query"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major"]
      - dependency-name: "turbo"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
