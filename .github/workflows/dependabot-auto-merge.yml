name: Dependabot auto-merge

# Turns on GitHub's native auto-merge for a Dependabot PR as soon as it opens, so the required
# checks (`checks` + `e2e`) merge it the moment they go green instead of it sitting open for days
# racing other bumps for pnpm-lock.yaml (Build Order steps 102 / 103). Branch protection still
# gates the merge — this only removes the manual "click merge once CI passes" step.
#
# The framework / toolchain carve-out set (kept in sync with .github/dependabot.yml's `deps` group
# `exclude-patterns`) is left alone: those land as individual PRs on purpose and get a human look.
# Majors are held too (they're mostly `ignore`d in dependabot.yml already — this is belt-and-braces).
#
# Recovery: if an auto-merged bump breaks `master`, revert the squash commit and add the package to
# dependabot.yml's `ignore` list.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Decide whether to auto-merge
        id: decide
        env:
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          # Keep this list in sync with .github/dependabot.yml's `deps` group exclude-patterns.
          hold='^(react|react-dom|react-is|next|next-themes|tailwindcss|typescript|eslint|turbo|@tanstack/react-query|@playwright/test)$|^@tiptap/|^@blocknote/|^@excalidraw/'
          verdict=merge
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            verdict=hold
            echo "::notice::major update — leaving for manual review"
          fi
          IFS=',' read -ra pkgs <<< "$NAMES"
          for raw in "${pkgs[@]}"; do
            p="$(echo "$raw" | xargs)"
            [ -z "$p" ] && continue
            if printf '%s\n' "$p" | grep -qE "$hold"; then
              verdict=hold
              echo "::notice::$p is in the manual-review carve-out"
            fi
          done
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.decide.outputs.verdict == 'merge'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
